<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoWork2D — Ingresar</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14; --bg2: #161922; --bg3: #1e2330;
    --border: #2e3650; --accent: #4ade80; --text: #e2e8f0; --text-dim: #64748b;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(rgba(74,222,128,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,.03) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .box {
    background: var(--bg2);
    border: 2px solid var(--border);
    box-shadow: 4px 4px 0 var(--accent);
    padding: 48px;
    width: 400px; max-width: 92vw;
    text-align: center;
  }
  .logo-icon { font-size: 48px; display: block; margin-bottom: 16px; }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px; letter-spacing: 2px;
    margin-bottom: 8px;
  }
  h1 span { color: var(--accent); }
  .tagline {
    font-family: 'VT323', monospace;
    font-size: 20px; color: var(--text-dim);
    margin-bottom: 40px;
  }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 14px;
    background: #fff; color: #1f1f1f;
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px; font-weight: bold;
    border: none; cursor: pointer;
    box-shadow: 4px 4px 0 #166534;
    transition: transform .1s, box-shadow .1s;
    text-decoration: none;
  }
  .btn-google:hover  { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 #166534; }
  .btn-google:active { transform: translate(2px,2px);   box-shadow: 2px 2px 0 #166534; }
  .google-icon { width: 20px; height: 20px; flex-shrink: 0; }
  .divider {
    margin: 28px 0 20px;
    border: none; border-top: 1px solid var(--border);
  }
  .hint { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
</style>
</head>
<body>
<div class="box">
  <span class="logo-icon">🏢</span>
  <h1>CoWork<span>2D</span></h1>
  <p class="tagline">Tu oficina virtual retro</p>

  <a href="/auth/google" class="btn-google">
    <svg class="google-icon" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Entrar con Google
  </a>

  <hr class="divider">
  <p class="hint">Solo tienen acceso quienes tengan el link de la sala.<br>Tus datos de Google solo se usan para mostrarte en el mapa.</p>
</div>
</body>
</html>
